<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventskalender: Türchen #20</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
  <script src="js/lock.js"></script>
  <script>if (Lock.unlocked()) location.replace('spiel.html');</script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #120d18;
      color: #fff7e8;
      font-family: "Trebuchet MS", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }
    main { width: 100%; max-width: 420px; text-align: center; }
    h1 { font-size: clamp(26px, 6vw, 38px); margin: 0 0 28px; font-weight: 700; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input {
      font-size: 20px;
      padding: 12px 14px;
      border: 2px solid #fff7e8;
      border-radius: 10px;
      background: #1e1726;
      color: #fff7e8;
      text-align: center;
    }
    input:focus { outline: 3px solid #e8663d; outline-offset: 2px; }
    button {
      font-size: 18px;
      font-weight: 700;
      padding: 12px;
      border: 2px solid #fff7e8;
      border-radius: 10px;
      background: #fff7e8;
      color: #2a1f2d;
      cursor: pointer;
    }
    button:hover { background: #ffe7b8; }
    #msg { min-height: 22px; margin: 4px 0 0; color: #ff8a7a; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Adventskalender: Türchen #20</h1>
    <form id="form" autocomplete="off">
      <input id="pw" type="password" placeholder="Passwort" aria-label="Passwort" autofocus>
      <button type="submit">Türchen öffnen</button>
      <p id="msg" role="alert"></p>
    </form>
  </main>
  <script>
    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var pw = document.getElementById('pw');
      if (Lock.unlock(pw.value)) { location.href = 'spiel.html'; return; }
      document.getElementById('msg').textContent = 'Falsches Passwort.';
      pw.select();
    });
  </script>
</body>
</html>
